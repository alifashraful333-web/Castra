<style>
:root{--bg:#eef1fb;--ink:#14183a;--mut:#5a6090;--card:#fff;--line:#d5daf0;--acc:#3b4cca;--on:#fff;--star:#b7791f;--warm:#a8480b;--ok:#1f7a4d;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1330;--ink:#e8ebff;--mut:#9aa1d6;--card:#181d44;--line:#2b3270;--acc:#8fa0ff;--on:#0f1330;--star:#f2c46d;--warm:#ffb86b;--ok:#6fd6a0;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1330;--ink:#e8ebff;--mut:#9aa1d6;--card:#181d44;--line:#2b3270;--acc:#8fa0ff;--on:#0f1330;--star:#f2c46d;--warm:#ffb86b;--ok:#6fd6a0;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,.55vw + 11px,22px)}
*{box-sizing:border-box}
a:not(.btn){color:var(--warm);font-weight:600;text-decoration:underline;text-underline-offset:3px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.pimg{max-width:100%;max-height:360px;border-radius:8px;border:1px solid var(--line);display:block;margin:8px 0}
.app{display:grid;grid-template-columns:clamp(230px,19vw,320px) minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:62px 14px 18px;display:flex;flex-direction:column;gap:18px}
.brand h1{letter-spacing:.08em}.fn{font-size:.75rem;line-height:1.3;margin-top:2px}
aside.side h1{font-size:1.4rem}aside.side .brand{flex-direction:column;align-items:flex-start;gap:8px}aside.side .brand svg{width:64px;height:32px;flex:none}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
main{min-width:0;padding:26px clamp(16px,3vw,56px) 60px}
nav.menu{display:flex;flex-direction:column;gap:4px;flex:1}
nav.menu button{width:100%}
nav.menu button{background:transparent;color:var(--ink);border:1px solid transparent;text-align:left}
nav.menu button[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.soon{font-size:.7rem;border:1px solid currentColor;border-radius:99px;padding:0 6px;margin-left:4px;opacity:.7}

 if(viewing)return `<button class="ghost small" data-act="closepres" style="margin-bottom:12px">Back to presentations</button><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">${esc(viewing.topic)}</h2><button class="small" data-act="fspres">Full screen</button></div><iframe id="pv" sandbox="allow-scripts allow-popups" srcdoc="${esc(viewing.html)}" title="${esc(viewing.topic)}" allowfullscreen style="width:100%;height:78vh;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe>`;
 const mg=R.filter(canManage),vis=new Set(R.filter(mine).map(r=>r.id)),ps=PRES.filter(x=>vis.has(x.classroom_id)).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
 const f=mg.length?`<div class="card"><h2>Upload a presentation</h2><label for="pr">Classroom</label><select id="pr">${mg.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>
 <label for="pt">Topic name</label><input id="pt"><label for="pf">Presentation file (.html)</label><input id="pf" type="file" accept=".html,.htm,text/html"><div style="margin-top:12px"><button data-act="addpres">Upload</button></div></div>`:(me.role==='student'?'':'<div class="card sub">You are not a teacher of any classroom yet.</div>');
 return `<h2>Presentations</h2>${f}${ps.length?ps.map(x=>{const r=R.find(q=>q.id===x.classroom_id);
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h3>${esc(x.topic)}</h3><div class="sub">${esc(r?r.name:'')}</div></div><div class="row"><button data-act="openpres" data-id="${x.id}" data-t="${esc(x.topic)}">Open</button><button class="ghost" data-act="dlpres" data-id="${x.id}" data-t="${esc(x.topic)}">Download</button></div></div><div class="sub" style="margin-top:8px">Uploaded by ${esc(nm(x.author_id))} · ${dts(x.created_at)}</div>${isAuth()||x.author_id===me.id?`<div style="margin-top:10px"><button class="small ghost" data-act="delpres" data-id="${x.id}">Delete</button></div>`:''}</div>`}).join(''):'<div class="card sub">No presentations yet.</div>'}`;
}
function resView(){
 const mg=R.filter(canManage),vis=R.filter(mine);
 const f=mg.length?`<div class="card"><h2>Add a resource</h2><label for="xr">Classroom</label><select id="xr">${mg.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>
 <label for="xn">Resource name</label><input id="xn"><label for="xl">Link (optional)</label><input id="xl" type="url" placeholder="https://..."><div style="margin-top:12px"><button data-act="addres">Upload</button></div></div>`:(me.role==='student'?'':'<div class="card sub">You are not a teacher of any classroom yet.</div>');
 const blocks=vis.map(r=>{const l=RES.filter(x=>x.classroom_id===r.id).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  if(!l.length)return '';
  return `<div class="card"><h3 style="margin-bottom:8px">${esc(r.name)}</h3><div class="list">${l.map((x,i)=>`<div><div><b>${i+1}.</b> ${esc(x.name)}<div class="sub">Added by ${esc(nm(x.author_id))} · ${dts(x.created_at)}</div></div><span class="row">${x.link?`<a class="btn" href="${esc(x.link)}" target="_blank" rel="noopener">Open</a>`:''}${isAuth()||x.author_id===me.id?`<button class="small ghost" data-act="delres" data-id="${x.id}">Delete</button>`:''}</span></div>`).join('')}</div></div>`}).join('');
 return `<h2>Resources</h2>${f}${blocks||'<div class="card sub">No resources yet.</div>'}`;
}
function page(){
 const m=MENU.find(x=>x[0]===tab)||MENU[0];
 if(tab==='dash')return dashView();if(tab==='students')return studentsView();if(tab==='rooms')return roomsView();
 if(tab==='attend')return attendView();if(tab==='records')return recordsView();if(tab==='pres')return presView();if(tab==='res')return resView();if(tab==='admin'&&isAuth())return adminView();
 return `<h2>${esc(m[2])}</h2><div class="card"><p>This page is not available yet.</p><p class="sub">It is being moved to the shared database and will return in an update.</p></div>`;
}
function render(){$('app').innerHTML=me?shell(openRoom?roomView():page()):authView()}
const ACT={
 mode(){mode=mode==='in'?'up':'in';render()},
 async signup(){
  const name=val('n'),institution=val('i'),email=val('e').toLowerCase(),password=$('p').value;
  if(!name)return say('Enter your name.');if(!institution)return say('Enter your institution.');
  if(!/^\S+@\S+\.\S+$/.test(email))return say('Enter a valid email.');if(password.length<6)return say('Use a password with at least 6 characters.');
  say('');const r=await sb.auth.signUp({email,password,options:{data:{name,institution}}});
  if(r.error)return say(r.error.message);
  if(!r.data.session)return say('Account created. Check your email to confirm it, then log in.');
  await enter(r.data.user)},
 async login(){
  const email=val('e').toLowerCase(),password=$('p').value;if(!email||!password)return say('Enter your email and password.');
  say('');const r=await sb.auth.signInWithPassword({email,password});if(r.error)return say(r.error.message);await enter(r.data.user)},
 async out(){await sb.auth.signOut();me=null;openRoom=null;mode='in';render()},
 tab(el){tab=el.dataset.v;openRoom=null;viewing=null;if(innerWidth<760)navOpen=false;render()},
 open(el){openRoom=el.dataset.id;tab='rooms';render()},
 back(){openRoom=null;render()},
 async mkroom(){const name=val('rn');if(!name)return say('Write the classroom name.');await db(sb.from('classrooms').insert({name,teacher_id:$('rt').value||null}));say('Classroom created.');await refresh()},
 async req(el){await db(sb.from('memberships').insert({classroom_id:el.dataset.id,user_id:me.id,status:'pending'}));await refresh()},
 async approve(el){await db(sb.from('memberships').update({status:'approved'}).eq('classroom_id',el.dataset.id).eq('user_id',el.dataset.u));await refresh()},
 async remove(el){await db(sb.from('memberships').delete().eq('classroom_id',el.dataset.id).eq('user_id',el.dataset.u));await refresh()},
 async start(el){const name=val('sn'),link=val('sl');if(!name)return say('Enter a class name.');
  if(!MEET.test(link))return say('Paste a Google Meet link that starts with https://meet.google.com/');
  await db(sb.from('class_sessions').insert({classroom_id:el.dataset.id,name,link,live:true}));await refresh()},
 async rename(el){const name=val('cn');if(!name)return;await db(sb.from('class_sessions').update({name}).eq('id',el.dataset.id));say('Class name saved.');await refresh()},
 async end(el){await db(sb.from('class_sessions').update({live:false}).eq('id',el.dataset.id));await refresh()},
 nav(){navOpen=!navOpen;render()},
 async addres(){const cid=$('xr').value,name=val('xn'),link=val('xl');
  if(!name)return say('Type the resource name.');if(link&&!/^https?:\/\/\S+\.\S+/i.test(link))return say('The link must start with https://');
  await db(sb.from('resources').insert({classroom_id:cid,name,link:link||null,author_id:me.id}));say('Resource added.');await refresh()},
 async delres(el){if(!confirm('Delete this resource?'))return;await db(sb.from('resources').delete().eq('id',el.dataset.id));await refresh()},
 async addrec(){const cid=$('rr').value,name=val('rnm'),link=val('rl');
  if(!name)return say('Choose or type the class name.');if(!/^https?:\/\/\S+\.\S+/i.test(link))return say('Paste the full Google Drive link, starting with https://');
  await db(sb.from('records').insert({classroom_id:cid,name,class_date:new Date().toISOString().slice(0,10),link,author_id:me.id}));say('Class record uploaded.');await refresh()},
 async delrec(el){if(!confirm('Delete this class record?'))return;await db(sb.from('records').delete().eq('id',el.dataset.id));await refresh()},
 async addpres(){const cid=$('pr').value,topic=val('pt'),f=$('pf').files[0];
  if(!topic)return say('Write the topic name.');if(!f)return say('Choose the presentation file (.html).');if(f.size>8e6)return say('The file is larger than 8 MB.');
  const html=await f.text();if(!/<html|<!doctype|<body/i.test(html))return say('This does not look like an HTML presentation file.');
  await db(sb.from('presentations').insert({classroom_id:cid,topic,html,size:html.length,author_id:me.id}));say('Presentation uploaded.');await refresh()},
 async openpres(el){const r=await db(sb.from('presentations').select('html').eq('id',el.dataset.id).single());viewing={id:el.dataset.id,topic:el.dataset.t,html:r.data.html};render()},
 closepres(){viewing=null;render()},
 fspres(){const f=$('pv');if(f&&f.requestFullscreen)f.requestFullscreen().catch(()=>say('Full screen is not available in this browser.'))},
 async dlpres(el){const r=await db(sb.from('presentations').select('html').eq('id',el.dataset.id).single());const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.data.html],{type:'text/html'}));a.download=((el.dataset.t||'presentation').replace(/[^\w\- ]+/g,'').trim()||'presentation')+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)},
 async delpres(el){if(!confirm('Delete this presentation?'))return;await db(sb.from('presentations').delete().eq('id',el.dataset.id));await refresh()},
 async deluser(el){if(!confirm('Remove '+el.dataset.n+' from the website? This deletes the account and cannot be undone.'))return;await db(sb.rpc('admin_delete_user',{uid:el.dataset.u}));say('Account removed.');await refresh()},
 async join(el){if(!presentIds({id:el.dataset.id}).includes(me.id))await db(sb.from('attendance').insert({session_id:el.dataset.id,user_id:me.id}));await refresh()}
};
document.addEventListener('click',async ev=>{
 const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(!f)return;
 if(el.dataset.act==='mode')ev.preventDefault();
 el.disabled=true;try{await f(el)}catch(e){say(e.message||String(e))}finally{el.disabled=false}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.closest&&ev.target.closest('.auth')&&ev.target.tagName==='INPUT'){const b=document.querySelector('.auth button[data-act]');if(b)b.click()}});
document.addEventListener('change',async ev=>{
 const mr=ev.target.closest('[data-mrole]');
 if(mr){try{await db(sb.rpc('set_member_role',{cid:mr.dataset.id,uid:mr.dataset.mrole,new_role:mr.value}));say('Role updated.');await refresh()}catch(e){say(e.message)}return}
 const s=ev.target.closest('[data-role]');if(!s)return;
 try{await db(sb.from('profiles').update({role:s.value}).eq('id',s.dataset.role));say('Role updated.');await refresh()}catch(e){say(e.message)}
});
(async()=>{try{const r=await sb.auth.getSession();if(r.data&&r.data.session)await enter(r.data.session.user)}catch(e){say(e.message||String(e))}render()})();
</script>
</body>
</html>
