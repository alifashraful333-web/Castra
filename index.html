function makePdf(jp){

 const add=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};

 const n=jp.length;add('%PDF-1.4\n');
 obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
 obj(2,()=>add('<< /Type /Pages /Count '+n+' /Kids ['+jp.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>'));
 jp.forEach((j,i)=>{const q=3+3*i,cs='q '+BW+' 0 0 '+BH+' 0 0 cm /Im0 Do Q';
  obj(q,()=>add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+BW+' '+BH+'] /Resources << /XObject << /Im0 '+(q+2)+' 0 R >> >> /Contents '+(q+1)+' 0 R >>'));
  obj(q+1,()=>add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
  obj(q+2,()=>{add('<< /Type /XObject /Subtype /Image /Width '+BW+' /Height '+BH+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.length+' >>\nstream\n');add(j);add('\nendstream')});
 });
 const total=3*n+3,xo=len;add('xref\n0 '+total+'\n0000000000 65535 f \n');
 for(let k=1;k<total;k++)add(String(offs[k]).padStart(10,'0')+' 00000 n \n');

}

  if(!c){a.innerHTML=page(`<p><b>No certificate found</b> with the ID <code>${esc(id)}</code>.</p><p class="sub">Check the ID and try again.</p>`);return}
  const d=dday(c.issued_at);let h;
  if(c.status==='valid')h=`<p class="ok" style="font-size:1.3rem;margin:0"><b>Valid certificate</b></p><p>This certifies that <b>${esc(c.holder_name)}</b> received <b>${esc(c.title)}</b>.</p><div class="sub">Issued by ${esc(c.issuer)} · authorized by ${esc(c.issued_by_name||'CASTRA authors')} · ${d}</div>`;
  else if(c.status==='revoked')h=`<p style="font-size:1.3rem;margin:0;color:var(--bad)"><b>Revoked</b></p><p>This certificate has been revoked and is no longer valid.</p><div class="sub">Original issue date: ${d}</div>`;
  else h=`<p style="font-size:1.3rem;margin:0;color:var(--warm)"><b>Replaced</b></p><p>This certificate was replaced by a newer one.</p>${c.replaced_by_code?`<p>Newer certificate: <a href="?verify=${encodeURIComponent(c.replaced_by_code)}">${esc(c.replaced_by_code)}</a></p>`:''}<div class="sub">Original issue date: ${d}</div>`;
  a.innerHTML=page(h+`<div class="sub" style="margin-top:10px">Certificate ID: ${esc(id)}</div>`);
 }catch(e){a.innerHTML=page(`<p class="err" role="alert">The certificate could not be checked right now: ${esc(e.message||e)}</p>`)}
}
