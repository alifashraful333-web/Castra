const BG={white:'#ffffff',black:'#15171c',green:'#1f4d38',blue:'#1d3a8a',red:'#8b1e2d'};
const PEN={red:'#e53935',orange:'#fb8c00',yellow:'#fdd835',green:'#43a047',cyan:'#00acc1',blue:'#1e88e5',purple:'#8e24aa',pink:'#ff6fae',brown:'#6d4c41',grey:'#9e9e9e',black:'#111111',white:'#ffffff'};

function drawSlide(g,sd){

 }
}

function makePdf(jp){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const add=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
 const obj=(n,fn)=>{offs[n]=len;add(n+' 0 obj\n');fn();add('\nendobj\n')};
 const n=jp.length;add('%PDF-1.4\n');
 obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
 obj(2,()=>add('<< /Type /Pages /Count '+n+' /Kids ['+jp.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>'));
 jp.forEach((j,i)=>{const q=3+3*i,cs='q '+BW+' 0 0 '+BH+' 0 0 cm /Im0 Do Q';
  obj(q,()=>add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+BW+' '+BH+'] /Resources << /XObject << /Im0 '+(q+2)+' 0 R >> >> /Contents '+(q+1)+' 0 R >>'));
  obj(q+1,()=>add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
  obj(q+2,()=>{add('<< /Type /XObject /Subtype /Image /Width '+BW+' /Height '+BH+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.length+' >>\nstream\n');add(j);add('\nendstream')});
 });
 const total=3*n+3,xo=len;add('xref\n0 '+total+'\n0000000000 65535 f \n');
 for(let k=1;k<total;k++)add(String(offs[k]).padStart(10,'0')+' 00000 n \n');
 add('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
 const out=new Uint8Array(len);let o=0;for(const u of parts){out.set(u,o);o+=u.length}return out;
}

ngth} event${events.length===1?'':'s'}</span></div>${eventHtml}</div></section><p class="sub sched-footnote">Calendar events are separate from completed class sessions and attendance records.</p></div>`;

function meetingsView(){

 let h=`<div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin-bottom:4px">Meetings</h2><p class="sub" style="margin-top:0">Private live video meetings. Only people you assign can see and join a meeting. Meetings never count toward class attendance.</p></div><button class="ghost small" data-act="meetrefresh">↻ Refresh</button></div>`;

 if(!manageable.length) h+=`<p class="sub">Only the author or a teacher assigned to a classroom can start a meeting.</p>`;
 else {const first=manageable[0].id;h+=`<label for="meet-room">Classroom</label><select id="meet-room" data-meet-room>${manageable.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select><label for="meet-name">Meeting title</label><input id="meet-name" maxlength="100" placeholder="e.g. Positional Astronomy — Discussion"><label>Assign participants</label><p class="sub">Tick the checkbox beside each person you want to invite. As author, you can choose any CASTRA account; classroom teachers can choose approved members of their classroom. Unselected people cannot see or join this meeting.</p><div id="meet-invitees">${meetingInviteesHTML(first)}</div><div style="margin-top:12px"><button data-act="meetstart">Start video meeting</button></div><p class="sub" style="margin-bottom:0">Meetings use Daily's managed video infrastructure. Usage beyond its free allowance may incur charges.</p>`}
 h+='</div>';

 else if(meetingError)h+=`<div class="card"><p class="sub">${esc(meetingError)}</p><button class="ghost small" data-act="meetrefresh">Try again</button></div>`;
 else {

async function meetingsLoad(){meetingLoadState='loading';meetingError='';render();try{const q=await sb.from('castra_meetings').select('*').order('started_at',{ascending:false}).limit(100);if(q.error)throw q.error;meetingRows=q.data||[];meetingLoadState='ready'}catch(e){meetingLoadState='error';meetingError='Meeting database setup is not complete, or access failed. Run CASTRA_Meetings_Setup.sql in Supabase, deploy the castra-meeting Edge Function, then refresh. Details: '+(e.message||String(e))}render()}
async function meetingInvoke(body){const r=await sb.functions.invoke('castra-meeting',{body});if(r.error)throw r.error;if(r.data?.error)throw new Error(r.data.error);return r.data}
async function openDailyMeeting(id,action){
 if(!window.DailyIframe)return say('The video meeting library did not load. Check your internet connection and refresh CASTRA.');
 const data=await meetingInvoke({action,meeting_id:id});
 if(dailyCall){try{await dailyCall.destroy()}catch{}dailyCall=null}
 activeMeetingId=id;render();
 const mount=$('daily-meeting-frame');if(!mount)return say('Meeting area could not be opened. Select Join meeting again.');

 await dailyCall.join({url:data.url,token:data.token});
}
async function leaveDailyMeeting(){if(dailyCall){try{await dailyCall.leave();await dailyCall.destroy()}catch{}dailyCall=null}activeMeetingId=null;render();await meetingsLoad()}

 async toggleatt(el){const r=R.find(x=>x.id===el.dataset.rid),ss=S.find(x=>x.id===el.dataset.sid),uid=el.dataset.u;if(!r||!ss||!uid||!canManage(r))return say('You do not have permission to change this attendance.');const present=A.some(a=>a.session_id===ss.id&&a.user_id===uid);if(present){const result=await db(sb.from('attendance').delete().eq('session_id',ss.id).eq('user_id',uid).select('session_id,user_id'));if(!result.data||result.data.length===0)throw new Error('Supabase did not delete the attendance row. Check the attendance DELETE policy.');await refresh();say('Marked absent.')}else{await db(sb.from('attendance').insert({session_id:ss.id,user_id:uid}));await refresh();say('Marked present.')}},
 async join(el){if(!presentIds({id:el.dataset.id}).includes(me.id))await db(sb.from('attendance').insert({session_id:el.dataset.id,user_id:me.id}));await refresh()}
};
document.addEventListener('click',async ev=>{
 const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(!f)return;
 if(el.dataset.act==='mode'||el.dataset.act==='totl')ev.preventDefault();
 el.disabled=true;try{await f(el)}catch(e){say(e.message||String(e))}finally{el.disabled=false}
});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d.dataset&&d.dataset.d){if(d.open)dopen.add(d.dataset.d);else dopen.delete(d.dataset.d)}},true);
document.addEventListener('input',ev=>{const t=ev.target;if(!t.closest)return;const a=t.closest('[data-ach]'),l=t.closest('[data-tl]');
 const lb=t.closest('[data-lb]');if(lb){LB[lb.dataset.lb]=lb.value;lbLoad(false).then(()=>{const g=$('lbbox');if(g)g.innerHTML=lbHTML()}).catch(e=>say(e.message));return}
 if(t.id==='aw-s'||t.id==='aw-d'||t.id==='aw-u'){awPreview(t.id==='aw-s');return}
 const dq=t.closest('[data-dq]');if(dq){defQ[dq.dataset.dq]=dq.value;const g=$('defbox');if(g)g.innerHTML=defTable();return}
 const df=t.closest('[data-df]');if(df){defDraft[df.dataset.df]=df.type==='checkbox'?df.checked:df.value;if(['kind','has_and','metric'].includes(df.dataset.df))render()}
 if(a){achF[a.dataset.ach]=a.value;const g=$('achgrid');if(g)g.innerHTML=galleryHTML()}
 if(l){tlF[l.dataset.tl]=l.value;const g=$('tlbox');if(g)g.innerHTML=timelineHTML()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&(achOpen||certOpen||defOpen||awOpen||celeb)){achOpen=null;certOpen=null;defOpen=null;defStep='';awOpen=null;celeb=null;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.closest&&ev.target.closest('.auth')&&ev.target.tagName==='INPUT'){const b=document.querySelector('.auth button[data-act]');if(b)b.click()}});
document.addEventListener('change',async ev=>{
 if(ev.target.matches&&ev.target.matches('[data-meet-room]')){const box=$('meet-invitees');if(box)box.innerHTML=meetingInviteesHTML(ev.target.value);return}
 const an2=ev.target.closest&&ev.target.closest('[data-an]');if(an2){an[an2.dataset.an]=an2.value;render();return}
 if(ev.target.matches&&ev.target.matches('input[data-img]'))return pickImg(ev.target);
 const mr=ev.target.closest('[data-mrole]');
 if(mr){try{await db(sb.rpc('set_member_role',{cid:mr.dataset.id,uid:mr.dataset.mrole,new_role:mr.value}));say('Role updated.');await refresh()}catch(e){say(e.message)}return}
 const s=ev.target.closest('[data-role]');if(!s)return;
 try{await db(sb.from('profiles').update({role:s.value}).eq('id',s.dataset.role));say('Role updated.');await refresh()}catch(e){say(e.message)}
});
window.addEventListener('beforeunload',e=>{if(bd&&bd.slides.some(x=>x.d)){e.preventDefault();e.returnValue=''}});
(async()=>{const vc=new URLSearchParams(location.search).get('verify');if(vc){showVerify(vc);return}
try{const r=await sb.auth.getSession();if(r.data&&r.data.session)await enter(r.data.session.user)}catch(e){say(e.message||String(e))}render()})();
</script>

<style>
#castra-install-app{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:99999;display:none;border:1px solid #6677d9;border-radius:999px;padding:12px 17px;background:linear-gradient(135deg,#7567f8,#287fd5);color:#fff;font:600 14px system-ui,sans-serif;box-shadow:0 8px 28px #0008;cursor:pointer}
#castra-install-app:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (display-mode: standalone){#castra-install-app{display:none!important}}
</style>
<button id="castra-install-app" type="button" aria-label="Install CASTRA app">✦ Install CASTRA</button>
<script>
(()=>{
  const installButton=document.getElementById('castra-install-app');
  let installPrompt=null;
  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  if(!isStandalone() && installButton){
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installButton.style.display='block';});
    installButton.addEventListener('click',async()=>{
      if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.style.display='none';}
      else { alert('To install CASTRA, open your browser menu and choose “Install app” or “Add to Home Screen”.'); }
    });
    window.addEventListener('appinstalled',()=>{installPrompt=null;installButton.style.display='none';});
    // iOS Safari does not emit beforeinstallprompt.
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    if(ios){installButton.style.display='block';}
  }
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('CASTRA offline setup unavailable:',err)));
  }
})();
</script>
