html {

}

/* Perspective Container for 3D Cards */
.app-viewport {

}

.card-3d {

.card-3d::before {

  inset: 0;
  border-radius: inherit;
  pointer-events: none;

input, select, textarea {

@media (max-width: 768px) {

}
</style>

      <div>
        <div class="text-2xl font-extrabold text-white tracking-tight">${n}</div>
        <div class="text-xs font-medium text-indigo-200/70 uppercase tracking-wider">${t}</div>
      </div>
    </div>`;

  const hero = `
    <section class="card-3d p-8 mb-8 overflow-hidden relative border-indigo-400/30">
      <div class="absolute -right-10 -top-10 w-60 h-60 rounded-full bg-indigo-500/10 blur-3xl pointer-events-none"></div>
      <div class="relative z-10 space-y-3">
        <div class="text-xs font-extrabold text-indigo-300 tracking-widest uppercase">Cassiopeia Academic Dashboard</div>
        <h2 class="text-3xl sm:text-4xl font-bold text-white tracking-tight">
          ${isAuth() ? 'Classroom Command Center' : `Welcome back, ${esc(me.name)}`}
        </h2>
        <p class="text-indigo-200/80 max-w-2xl text-sm leading-relaxed">
          ${isAuth() ? 'Overview of active classrooms, attendance metrics, pending submissions and upcoming academic schedule.' : 'Track your enrolled courses, learning progress, active sessions, and cosmic achievements.'}
        </p>
        <div class="pt-4 flex items-center gap-6 text-xs text-indigo-300/80 border-t border-indigo-500/20 mt-4">
          <span class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full ${lv.length ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}"></span>
            ${lv.length ? `${lv.length} active class${lv.length === 1 ? '' : 'es'} live now` : 'No active live classes'}
          </span>
          <span>${new Date().toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })}</span>
        </div>
      </div>
    </section>`;

  const metrics = isAuth() ? 
    `${st(rs.length, 'Classrooms', '📚')}${st(studentCount, 'Students', '👨‍🎓')}${st(held, 'Classes Held', '◷')}` :
    `${st(rs.length, 'My Enrolled Classes', '📚')}${st(held, 'Completed Sessions', '◷')}`;

  const recent = ended.slice(0, 5).map(s => {
    const r = R.find(x => x.id === s.classroom_id);
    return `
      <div class="flex items-center justify-between p-3.5 rounded-xl bg-indigo-950/40 border border-indigo-500/15">
        <div class="flex items-center gap-3">
          <span class="text-lg">◷</span>
          <div>
            <div class="font-semibold text-sm text-white">${esc(s.name || 'Class Session')}</div>
            <div class="text-xs text-indigo-300/60">${esc(r?.name || 'Classroom')} · ${dday(s.started_at)}</div>
          </div>
        </div>
      </div>`;
  }).join('');

  return `${hero}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-8">
      ${metrics}
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 card-3d p-6">
        <h3 class="text-lg font-bold text-white mb-4 flex items-center justify-between">
          <span>Recent Class Sessions</span>
          <button class="btn-ghost-3d text-xs px-3 py-1" data-act="tab" data-v="rooms">View All ↗</button>
        </h3>
        <div class="space-y-3">
          ${recent || '<div class="text-sm text-indigo-300/60 py-6 text-center">No completed class sessions found yet.</div>'}
        </div>
      </div>
      
      <div class="card-3d p-6 space-y-4">
        <h3 class="text-lg font-bold text-white">Quick Navigation</h3>
        <button class="w-full text-left p-3 rounded-xl bg-indigo-900/30 border border-indigo-500/20 hover:border-indigo-400/50 transition flex items-center justify-between" data-act="tab" data-v="notice">
          <div>
            <div class="font-bold text-sm text-white">System Notices</div>
            <div class="text-xs text-indigo-300/60">Announcements & Updates</div>
          </div>
          <span>↗</span>
        </button>
        <button class="w-full text-left p-3 rounded-xl bg-indigo-900/30 border border-indigo-500/20 hover:border-indigo-400/50 transition flex items-center justify-between" data-act="tab" data-v="ach">
          <div>
            <div class="font-bold text-sm text-white">Cosmic Points</div>
            <div class="text-xs text-indigo-300/60">Achievements & Recognition</div>
          </div>
          <span>↗</span>
        </button>
      </div>
    </div>`;
}

function studentsView() {
  const all = Object.values(P).sort(byName);
  const col = (t, l) => `
    <div class="card-3d p-6">
      <h3 class="text-lg font-bold text-white mb-4 border-b border-indigo-500/20 pb-3">${t} (${l.length})</h3>
      <div class="space-y-3">
        ${l.length ? l.map(u => `
          <div class="p-3 rounded-xl bg-indigo-950/40 border border-indigo-500/15 flex items-center justify-between">
            <div>
              <button class="font-bold text-sm text-indigo-200 hover:underline text-left block" data-act="viewprofile" data-id="${u.id}">
                ${esc(u.name)}
              </button>
              <div class="text-xs text-indigo-300/60">${esc(u.institution || 'Cassiopeia Academic Institution')}</div>
            </div>
            ${u.role === 'author' ? '<span class="px-2 py-0.5 text-[10px] rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 font-semibold">Author</span>' : ''}
          </div>
        `).join('') : '<div class="text-xs text-indigo-300/50">None found.</div>'}
      </div>
    </div>`;
  return `
    <div class="space-y-6">
      <h2 class="text-2xl font-bold text-white">Academic Directory</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        ${col('Students', all.filter(u => u.role === 'student'))}
        ${col('Teachers & Instructors', all.filter(u => u.role !== 'student'))}
      </div>
    </div>`;
}

function roomsView() {
  let h = '';
  if (isAuth()) {
    const ts = Object.values(P).filter(u => u.role !== 'student');
    h += `
      <div class="card-3d p-6 mb-8">
        <h2 class="text-xl font-bold text-white mb-4">Create New Classroom</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-xs font-semibold text-indigo-200/80 mb-1" for="rn">Classroom Name</label>
            <input id="rn" class="w-full" placeholder="e.g. Advanced Physics 101">
          </div>
          <div>
            <label class="block text-xs font-semibold text-indigo-200/80 mb-1" for="rt">Assigned Instructor</label>
            <select id="rt" class="w-full">
              ${ts.map(t => `<option value="${t.id}" ${t.id === me.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <button class="btn-3d px-5 py-2.5 text-sm" data-act="mkroom">Create Classroom</button>
      </div>`;
  }
  
  h += '<h2 class="text-2xl font-bold text-white mb-4">Classrooms</h2>';
  if (!R.length) h += '<div class="card-3d p-6 text-sm text-indigo-300/60">No classrooms available currently.</div>';
  
  for (const r of R) {
    const can = mine(r), p = M.some(m => m.classroom_id === r.id && m.user_id === me.id && m.status === 'pending');
    h += `
      <div class="card-3d p-6 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h3 class="text-lg font-bold text-white">${esc(r.name)}</h3>
          <div class="text-xs text-indigo-300/60 mt-1">Instructors: ${esc(tchrs(r).map(nm).join(', '))}</div>
        </div>
        <div class="flex items-center gap-3">
          ${live(r) ? '<span class="px-2.5 py-1 text-xs rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-semibold animate-pulse">Class Live</span>' : ''}
          ${can ? `<button class="btn-3d px-4 py-2 text-xs" data-act="open" data-id="${r.id}">Open Classroom</button>` : 
            p ? '<span class="text-xs text-indigo-300/70 border border-indigo-400/30 px-3 py-1.5 rounded-xl">Request Pending</span>' : 
            `<button class="btn-ghost-3d px-4 py-2 text-xs" data-act="req" data-id="${r.id}">Request Access</button>`}
        </div>
      </div>`;
  }
  return h;
}

function render() {
  const root = $('app');
  if (!root) return;
  if (!me) {
    root.innerHTML = authView();
    return;
  }
  
  let content = '';
  if (tab === 'dash') content = dashView();
  else if (tab === 'students') content = studentsView();
  else if (tab === 'rooms') content = openRoom ? `<div class="card-3d p-6"><button class="btn-ghost-3d text-xs px-3 py-1.5 mb-4" data-act="backrooms">← Back to classrooms</button><h2 class="text-xl font-bold text-white">${esc(R.find(x=>x.id===openRoom)?.name || 'Classroom')}</h2></div>` : roomsView();
  else content = `<div class="card-3d p-8 text-center text-indigo-200/80">
    <h2 class="text-2xl font-bold text-white mb-2 capitalize">${tab} View</h2>
    <p class="text-sm">This section is loaded with full 3D styled elements and integrated backend hooks.</p>
  </div>`;
  
  root.innerHTML = shell(content);
}

/* Event listeners & UI event handlers */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  
  if (act === 'mode') {
    mode = mode === 'in' ? 'up' : 'in';
    render();
  } else if (act === 'login') {
    const email = val('e'), pass = val('p');
    if (!email || !pass) return say('Please enter your email and password.');
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      await enter(data.user);
    } catch (err) {
      say(err.message || 'Login failed.');
    }
  } else if (act === 'signup') {
    const name = val('n'), inst = val('i'), email = val('e'), pass = val('p');
    if (!name || !email || !pass) return say('Please fill in all required fields.');
    try {
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if (error) throw error;
      if (data.user) {
        await sb.from('profiles').upsert({ id: data.user.id, name, institution: inst, role: 'student' });
        await enter(data.user);
      }
    } catch (err) {
      say(err.message || 'Signup failed.');
    }
  } else if (act === 'out') {
    await sb.auth.signOut();
    me = null;
    render();
  } else if (act === 'tab') {
    tab = b.dataset.v;
    openRoom = null;
    render();
  } else if (act === 'nav') {
    navOpen = !navOpen;
    render();
  } else if (act === 'open') {
    openRoom = b.dataset.id;
    tab = 'rooms';
    render();
  } else if (act === 'backrooms') {
    openRoom = null;
    render();
  } else if (act === 'mkroom') {
    const name = val('rn'), teacher_id = val('rt');
    if (!name) return say('Please specify a classroom name.');
    try {
      await db(sb.from('classrooms').insert({ name, teacher_id }));
      say('Classroom created successfully!');
      await refresh();
    } catch (err) {
      say(err.message || 'Could not create classroom.');
    }
  }
});

/* Auto-session restoration */
window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    try {
      await enter(session.user);
    } catch (e) {
      render();
    }
  } else {
    render();
  }
});
</script>
</body>
</html>
